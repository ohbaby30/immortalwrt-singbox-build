name: Build ImmortalWrt R4S SingBox

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "ImmortalWrt branch"
        required: true
        default: "master"
      config:
        description: "Config file in this repo"
        required: true
        default: "configs/r4s.config"
  schedule:
    # GitHub cron uses UTC. This runs every Sunday at 02:00 Asia/Shanghai.
    - cron: "0 18 * * 6"

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build config
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-${{ github.job }}-${{ inputs.branch || 'master' }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ github.job }}-${{ inputs.branch || 'master' }}-

      - name: Install build dependencies
        run: |
          sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'

      - name: Clone ImmortalWrt
        run: |
          git clone -b "${{ inputs.branch || 'master' }}" --single-branch --filter=blob:none https://github.com/immortalwrt/immortalwrt immortalwrt

      - name: Add custom feeds
        working-directory: immortalwrt
        run: |
          {
            echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main"
            echo "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main"
          } >> feeds.conf.default

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom files
        run: |
          if [ -d files-r4s ]; then
            mkdir -p immortalwrt/files
            cp -a files-r4s/. immortalwrt/files/
          fi

      - name: Load config
        run: |
          cp "${{ inputs.config || 'configs/r4s.config' }}" immortalwrt/.config

      - name: Make defconfig
        working-directory: immortalwrt
        run: |
          make defconfig

      - name: Validate requested packages
        working-directory: immortalwrt
        env:
          REQUESTED_CONFIG: ../${{ inputs.config || 'configs/r4s.config' }}
        run: |
          missing=0
          while IFS= read -r symbol; do
            if ! grep -qxF "$symbol" .config; then
              echo "::error::Requested config symbol was dropped: $symbol"
              missing=1
            fi
          done < <(grep -E '^CONFIG_PACKAGE_[-A-Za-z0-9_+.]+=[ym]$' "$REQUESTED_CONFIG")
          exit "$missing"

      - name: Download sources
        working-directory: immortalwrt
        run: |
          for i in 1 2 3; do
            if make download -j"$(nproc)"; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "::error::Download failed after 3 attempts"
              exit 1
            fi
            echo "Download attempt $i failed, retrying..."
          done
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Setup ccache
        working-directory: immortalwrt
        run: |
          sudo apt-get install -y ccache
          mkdir -p ~/.ccache
          ccache -M 2G
          echo "CCACHE_DIR=~/.ccache" >> "$GITHUB_ENV"

      - name: Compile firmware
        working-directory: immortalwrt
        env:
          USE_CCACHE: "1"
          CCACHE_DIR: "~/.ccache"
        run: |
          make -j"$(nproc)" V=s

      - name: Collect firmware and Passwall2 apks
        run: |
          mkdir -p artifact
          cp -v immortalwrt/bin/targets/rockchip/armv8/immortalwrt-rockchip-armv8-friendlyarm_nanopi-r4s-squashfs-sysupgrade.img.gz artifact/
          find immortalwrt/bin/packages immortalwrt/bin/targets -type f -name '*passwall2*.apk' -exec cp -v {} artifact/ \;
          if ! ls artifact/*passwall2*.apk >/dev/null 2>&1; then
            echo "passwall2 apk files not found"
            exit 1
          fi
          cd artifact && sha256sum * > SHA256SUMS && cd ..

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: immortalwrt-r4s-singbox-${{ inputs.branch || 'master' }}-${{ github.run_number }}
          name: ImmortalWrt R4S SingBox ${{ inputs.branch || 'master' }} build ${{ github.run_number }}
          files: |
            artifact/immortalwrt-rockchip-armv8-friendlyarm_nanopi-r4s-squashfs-sysupgrade.img.gz
            artifact/*passwall2*.apk
            artifact/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: true

      - name: Delete old R4S SingBox releases
        uses: actions/github-script@v8
        if: success()
        with:
          script: |
            const currentTag = 'immortalwrt-r4s-singbox-${{ inputs.branch || 'master' }}-${{ github.run_number }}';
            const prefix = 'immortalwrt-r4s-singbox-';
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            for (const release of releases) {
              if (!release.tag_name.startsWith(prefix) || release.tag_name === currentTag) {
                continue;
              }

              core.info(`Deleting old release ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                core.warning(`Could not delete tag ${release.tag_name}: ${error.message}`);
              }
            }

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: immortalwrt-r4s-singbox-${{ inputs.branch || 'master' }}-${{ github.run_number }}
          path: |
            artifact/immortalwrt-rockchip-armv8-friendlyarm_nanopi-r4s-squashfs-sysupgrade.img.gz
            artifact/*passwall2*.apk
            artifact/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
